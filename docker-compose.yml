version: "3.9"

services:
  app:
    image: voiceai:latest
    build:
      context: .
      target: runtime
    command: supervisord -c /etc/supervisor/conf.d/supervisord.conf
    ports:
      - "3000:3000"
      - "4000:4000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      CUDA_VISIBLE_DEVICES: ""
    networks:
      - voipnet

  whisper:
    image: voiceai:latest
    command: python3 -u server/WhisperLive/run_server.py --port 4000 --backend faster_whisper
    restart: unless-stopped
    expose:
      - "4000"
      - "4001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - voipnet

networks:
  voipnet:
    driver: bridge
