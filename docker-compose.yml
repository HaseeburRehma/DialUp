version: "3.9"

services:
  app:
    image: voiceai:latest
    build:
      context: .
      target: runtime
    container_name: voiceai-app
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "4001:4001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      CUDA_VISIBLE_DEVICES: ""
      PORT: 3000
      WHISPER_PORT: 4000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - voipnet
    volumes:
      # Optional: persist logs
      - ./logs:/var/log/supervisor

networks:
  voipnet:
    driver: bridge