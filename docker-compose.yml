version: "3.9"

services:
  app:
    image: voiceai:latest
    build:
      context: .
      target: runtime
    container_name: voiceai-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      WHISPER_HOST: whisper
      WHISPER_PORT: 4001
    depends_on:
      whisper:
        condition: service_healthy
    networks:
      - voipnet

  whisper:
    image: voiceai:latest
    container_name: voiceai-whisper
    command: python3 -u server/WhisperLive/run_server.py --port 4001 --backend faster_whisper
    restart: unless-stopped
    expose:
      - "4001"
      - "4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - voipnet

networks:
  voipnet:
    driver: bridge
