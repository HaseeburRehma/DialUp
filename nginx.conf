server {
  listen 443 ssl;  # ❌ remove 'http2' here!
  server_name voiceai.wordpressstagingsite.com;

  ssl_certificate     /etc/letsencrypt/live/voiceai.wordpressstagingsite.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/voiceai.wordpressstagingsite.com/privkey.pem;

  client_max_body_size 100M;
  gzip off;
  proxy_buffering off;

  # Common headers
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Whisper WebSocket proxy
  location /whisper {
    proxy_pass http://whisper:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Sec-WebSocket-Extensions "";
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    tcp_nodelay on;
  }

  # Twilio stream proxy
  location /twilio-stream {
    proxy_pass http://app:3000/twilio-stream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Sec-WebSocket-Extensions "";
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    proxy_buffering off;
    tcp_nodelay on;
  }

  # App (Next.js + Express backend)
  location / {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
  }
}
# Optional redirect from HTTP → HTTPS
server {
  listen 80;
  server_name voiceai.wordpressstagingsite.com;
  return 301 https://$host$request_uri;
}
